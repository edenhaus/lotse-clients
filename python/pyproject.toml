# The Python client of the lotse control API. The models are generated from the
# JSON Schema bundle in ../schema by datamodel-code-generator (`uv run
# datamodel-codegen`, configured below) and the command methods from the bundle and
# those models by scripts/generate_commands.py; the WebSocket transport is hand-written.

[project]
name = "lotse-client"
# The lotse release whose API bundle schema/api.json is; 0.0.0 until the first. Changing it on
# main releases it to PyPI (.github/workflows/release.yml, ../README.md#releasing).
version = "0.0.0"
description = "Async client for the lotse media daemon's control API"
readme = "README.md"
license = "MIT OR Apache-2.0" # PEP 639: an SPDX expression, so no license classifier
license-files = ["LICENSE-MIT", "LICENSE-APACHE"] # symlinks to the repository's
requires-python = ">=3.14"
keywords = ["lotse", "webrtc", "rtsp", "camera"]
classifiers = [
  "Development Status :: 3 - Alpha", # lotse is pre-1.0, and so is its API
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: POSIX", # the daemon is reached over a Unix socket
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.12", # the WebSocket over the Unix socket
  "mashumaro>=3.15", # decoding and encoding the generated dataclasses
  "orjson>=3.10", # mashumaro's JSON mixin and the frames on the wire
]

[project.urls]
Repository = "https://github.com/edenhaus/lotse-clients"
Issues = "https://github.com/edenhaus/lotse-clients/issues"
Daemon = "https://github.com/edenhaus/lotse"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
]
# `mise run dist`: the metadata PyPI renders, checked before the release uploads it.
release = ["twine==7.0.0"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100 # rustfmt's width, as in the Rust code
# Tool output, formatted by the generator itself and guarded by `datamodel-codegen --check`.
extend-exclude = ["src/lotse_client/models.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter (ruff warns when both are on)
  "CPY001", # no file in the repository carries a copyright header; the license is in LICENSE-*
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# What conflicts with pytest and with the tests' conventions, as the Rust tests relax
# the production-only lints (lotse's AGENTS.md).
"tests/*" = [
  "D1", # test names are the docs
  "PLR2004", # expected values are written inline
  "S101", # pytest's assertions are plain `assert`
  "SLF001", # tests drive the transport's internals (a cancelled wait, a failed send)
]
# The command generator runs the environment's ruff on its output, with fixed arguments.
"scripts/*" = ["S603"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=lotse_client --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["error"]

[tool.coverage.report]
# A script's entry point runs only from the command line; the tests call `main`.
exclude_also = ['if __name__ == "__main__":']


# `uv run datamodel-codegen` writes src/lotse_client/models.py from the bundle, and
# `uv run python scripts/generate_commands.py` then writes _commands.py from both;
# `--check` on either fails when its output is stale (the python-client hook).
[tool.datamodel-codegen]
input = "../schema/api.json"
input-file-type = "jsonschema"
output = "src/lotse_client/models.py"
output-model-type = "dataclasses.dataclass"
target-python-version = "3.14"
base-class = "lotse_client._base.Model" # mashumaro, leaving out None when encoding
frozen-dataclasses = true
keyword-only = true
enum-field-as-literal = "all"
use-one-literal-as-default = true
use-schema-description = true
use-field-description = true
use-title-as-name = true
use-union-operator = true
strict-nullable = true # a defaulted field is not nullable unless the schema says so
use-standard-collections = true
disable-timestamp = true
formatters = ["ruff-format"]
custom-file-header = """# Generated by datamodel-code-generator from schema/api.json.
# Do not edit: change the Rust types in lotse, copy its bundle to schema/, then
# run `uv run datamodel-codegen` in python/."""
