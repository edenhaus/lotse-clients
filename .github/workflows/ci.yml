name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1" # weekly: the zizmor job, for what changes without our code changing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every prek hook on all files, the contract tests included: the same as `mise run check`
  # with ROCKO_BIN set, against a daemon built from the rocko commit in schema/rocko-commit.
  check:
    name: every prek hook
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned rocko commit
        id: pin
        run: echo "sha=$(cat schema/rocko-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edenhaus/rocko
          ref: ${{ steps.pin.outputs.sha }}
          path: .rocko
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .rocko -> target
      - name: Build the daemon with the fake source
        # In the checkout: rust-toolchain.toml and .cargo/config.toml are read from there.
        working-directory: .rocko
        run: cargo build -q --workspace --all-features --locked --bin rocko
      - run: mise run check
        env:
          ROCKO_BIN: ${{ github.workspace }}/.rocko/target/debug/rocko

  # The workflows' security audit with zizmor's online audits, which the prek hook leaves out (an
  # advisory against a pinned action, a pin no tag or branch of its repository holds, a ref both a
  # tag and a branch): on main and weekly, so a finding that appears without our code changing
  # fails no unrelated PR. The findings go to code scanning, under the zizmor category, and fail no
  # run: an alert stays open there until a commit fixes it.
  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploading the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: zizmor
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }} # the online audits read the actions' repositories
        run: zizmor --persona=pedantic --strict-collection --no-exit-codes --no-progress --format=sarif . > zizmor.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
