name: sync-schema

# Opens, or updates, the PR that brings rocko's API schema here and regenerates every
# client's models and command methods. rocko's CI (ci.yml) dispatches `rocko-schema` when a push to its main
# changes the schema; run it by hand to sync from any ref. The PR's CI runs the contract
# tests against that commit.
on:
  repository_dispatch:
    types: [rocko-schema]
  workflow_dispatch:
    inputs:
      ref:
        description: rocko commit, branch or tag to sync from
        default: main

permissions: {}

# A newer schema replaces an older one, so a newer run makes a running one moot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    name: sync the schema from rocko
    runs-on: ubuntu-latest
    steps:
      # The app's token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN runs no CI. The app
      # (Contents: write, Pull requests: write) is installed on rocko and rocko-clients; both keep
      # its client ID as the variable ROCKO_BOT_CLIENT_ID and its key as the secret
      # ROCKO_BOT_PRIVATE_KEY.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.ROCKO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROCKO_BOT_PRIVATE_KEY }}
          permission-contents: write # push the branch
          permission-pull-requests: write # open, edit or close the PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edenhaus/rocko
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          path: .rocko
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run schema .rocko
      - name: The synced rocko commit
        id: pin
        run: echo "sha=$(cat schema/rocko-commit)" >> "$GITHUB_OUTPUT"
      # One branch: a later sync replaces the open PR's commit, and closes the PR when main
      # already matches. A script rather than an action, so the write token reaches no
      # third-party code. mise-action's `mise install` installs the repository's git hooks;
      # the commit and the push skip them, so a sync the hooks reject still becomes a PR,
      # whose CI runs every hook and the contract tests.
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          branch=sync/rocko-schema
          title="chore(schema): sync with rocko ${SHA:0:12}"
          body="The API schema of rocko at edenhaus/rocko@$SHA, and every client's models and command methods regenerated from it.

          CI runs the contract tests against that commit. A change the generators cannot follow fails them: push the fix to this branch, but know that the next schema change on rocko's main replaces the branch."
          state="$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)"
          git add schema python/src/rocko_client/models.py python/src/rocko_client/_commands.py \
            python/src/rocko_client/version.py
          if git diff --cached --quiet; then
            echo "main already matches rocko $SHA"
            if [ "$state" = OPEN ]; then
              gh pr close "$branch" --delete-branch --comment "main matches rocko $SHA now."
            fi
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git switch -q -C "$branch"
          git -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -q --no-verify -m "$title"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push -q --force --no-verify origin "$branch"
          if [ "$state" = OPEN ]; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
