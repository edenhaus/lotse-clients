name: release

# Publishes the Python client to PyPI when a release is published on GitHub (README.md#releasing).
#
# CI's release-notes job keeps the draft of the next release up to date from the merged PRs
# (Release Drafter, .github/release-drafter.yml), and publishing it, by hand, tags the commit and
# starts this. The repository keeps version 0.0.0: this run takes the version from the tag and
# sets it in the build only. It checks that schema/api.json is the API bundle of a published rocko
# release, so no client speaks an API no released daemon has, builds the sdist and the wheel,
# attests them, uploads them to PyPI with Trusted Publishing, and attaches them to the release,
# whose notes name that rocko release.
#
# A failed run is resumed with "Re-run failed jobs"; PyPI refuses a file it already has, so a
# re-run of all jobs after the upload fails at the upload.

on:
  release:
    types: [published]

permissions: {}

# One release at a time, never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false" # each job installs the tools it names, not the whole mise.toml

jobs:
  version:
    name: the version from the tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # X.Y.Z only: a SemVer pre-release tag (0.1.0-rc.1) is not the PEP 440 version that PyPI and
      # the wheel's file name would carry (0.1.0rc1).
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not X.Y.Z; Release Drafter tags releases with the bare version, no v and no pre-release"
            exit 1
          fi
          echo "version=$TAG" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build and check the sdist and the wheel
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout
    outputs:
      rocko: ${{ steps.rocko.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest published rocko release (pre-releases count, drafts do not) whose bundle is
      # schema/api.json byte for byte, as `mise run schema` copies it. A release from before
      # rocko-api-types had that name has no bundle at the path and never matches. The bundle comes
      # through curl, not `gh api`: gh 2.105.0 rewrites the JSON escapes of control characters
      # (`\u0000`) in what it prints, so its copy never equals the file (observed 2026-11-24).
      - name: Find the rocko release whose API bundle this is
        id: rocko
        env:
          GH_TOKEN: ${{ github.token }} # rocko is public; the token only lifts the rate limit
        run: |
          bundle="$RUNNER_TEMP/api.json"
          for tag in $(gh release list -R edenhaus/rocko --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'); do
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
                "https://api.github.com/repos/edenhaus/rocko/contents/crates/rocko-api-types/schema/api.json?ref=$tag" -o "$bundle" \
              && cmp -s schema/api.json "$bundle"; then
              echo "version=$tag" | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::schema/api.json is the API bundle of no published rocko release: release rocko first, or sync the schema from a release (sync-schema with its tag as ref)"
          exit 1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv
          cache: false # nothing cached reaches a release job
      - run: mise run set-version "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: mise run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  # The only job with an OIDC token, and the only one in the `pypi` environment that PyPI's
  # trusted publisher names; it runs no code from the repository.
  publish:
    name: attest and publish to PyPI
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rocko-client/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing, and the Sigstore certificates of the attestations
      attestations: write # store GitHub's attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest the provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      # Also uploads a PEP 740 attestation of each file to PyPI (`attestations`, on by default).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  release:
    name: attach the files to the release
    needs: [version, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the release and add to its notes
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attach the files and complete the notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
          ROCKO: ${{ needs.build.outputs.rocko }}
        run: |
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > notes.md
          # shellcheck disable=SC2016 # envsubst's list of the variables to replace, kept literal
          envsubst '$VERSION $ROCKO $GH_REPO' >> notes.md <<'EOF'

          ## Install

          [rocko-client $VERSION on PyPI](https://pypi.org/project/rocko-client/$VERSION/), the Python client of the control API of [rocko $ROCKO](https://github.com/edenhaus/rocko/releases/tag/$ROCKO).

          ## Verify

          ```sh
          gh attestation verify rocko_client-$VERSION-py3-none-any.whl --repo $GH_REPO
          ```
          EOF
          gh release edit "$TAG" --notes-file notes.md
